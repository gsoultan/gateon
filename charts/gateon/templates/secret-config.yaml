# A Secret rather than a ConfigMap, because global.json is where the database
# password and the paseto secret live. Gateon encrypts those fields at rest when
# GATEON_ENCRYPTION_KEY is set, but a file mounted from a ConfigMap is readable
# by anything that can read ConfigMaps in this namespace, which is a wider set
# than it looks.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateon.fullname" . }}-config
  labels: {{- include "gateon.labels" . | nindent 4 }}
type: Opaque
stringData:
  entrypoints.json: |
{{ include "gateon.entrypointsJSON" . | indent 4 }}
{{- if include "gateon.hasGlobalConfig" . }}
  global.json: |
{{ include "gateon.globalConfig" . | indent 4 }}
{{- end }}
