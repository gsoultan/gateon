{{- if not .Values.secrets.existingSecret }}
{{- $name := include "gateon.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := default dict (get (default dict $existing) "data") }}
{{- $key := .Values.secrets.encryptionKey }}
{{- if $key }}
{{- if lt (len $key) 16 }}
{{- fail "secrets.encryptionKey must be at least 16 characters. Below that the runtime rejects it and writes the paseto secret, database URL and database password to global.json in CLEARTEXT, warning once and otherwise behaving exactly as if encryption were on." }}
{{- end }}
{{- else if hasKey $data "encryption-key" }}
{{/*
  Reuse the generated key across upgrades. Without this lookup, `helm upgrade`
  mints a new one every time, and a new key cannot decrypt what the old one
  wrote — the gateway comes back unable to read its own paseto secret or reach
  its own database. Generation is a first-install convenience; the key is
  permanent state from the moment it encrypts anything.
*/}}
{{- $key = index $data "encryption-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gateon.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  encryption-key: {{ $key | b64enc | quote }}
  {{- /*
    The identity secrets (ADR 0056), each reused from the Secret when it is
    already there and generated only when it is not -- so an upgrade from a
    chart that did not have them generates them once, and no upgrade after
    that changes them. A new session key would sign every user out and leave
    every second factor encrypted under the old one; a new audit signature key
    would make the whole stored audit chain fail verification.

    The session key is exactly 32 characters: gateon uses the first 32 bytes as
    the PASETO v4 key, so anything longer would only look stronger.
  */}}
  {{- range $env, $secretKey := include "gateon.identityKeys" . | fromYaml }}
  {{- $value := "" }}
  {{- if hasKey $data $secretKey }}
  {{- $value = index $data $secretKey | b64dec }}
  {{- else if eq $secretKey "session-key" }}
  {{- $value = randAlphaNum 32 }}
  {{- else }}
  {{- $value = randAlphaNum 64 }}
  {{- end }}
  {{ $secretKey }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
