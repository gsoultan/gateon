{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" (include "gateon.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secrets.encryptionKey }}
{{- if $key }}
{{- if lt (len $key) 16 }}
{{- fail "secrets.encryptionKey must be at least 16 characters. Below that the runtime rejects it and writes the paseto secret, database URL and database password to global.json in CLEARTEXT, warning once and otherwise behaving exactly as if encryption were on." }}
{{- end }}
{{- else if $existing }}
{{/*
  Reuse the generated key across upgrades. Without this lookup, `helm upgrade`
  mints a new one every time, and a new key cannot decrypt what the old one
  wrote — the gateway comes back unable to read its own paseto secret or reach
  its own database. Generation is a first-install convenience; the key is
  permanent state from the moment it encrypts anything.
*/}}
{{- $key = index $existing.data "encryption-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gateon.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  encryption-key: {{ $key | b64enc | quote }}
{{- end }}
