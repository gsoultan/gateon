# golangci-lint configuration for gateon.
#
# This file makes the `arch` developer-profile limits in .junie/agents.md
# machine-checkable instead of prose-only. Thresholds below are taken verbatim
# from "Key Readability Rules for Go Functions" in that document:
#   - a function should be at most 50 lines
#   - a function takes at most 3 parameters
#   - nesting / cognitive complexity is kept to a minimum
#   - no magic strings; use constants
#   - every Go file carries the copyright header and an SPDX license line
#
# The codebase predates this config, so `make lint` reports existing debt while
# `make lint-new` gates only code you actually changed. See the Makefile.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - funlen # function length limit
    - cyclop # cyclomatic complexity
    - gocognit # cognitive complexity ("minimize nesting")
    - goconst # repeated strings that should be constants
    - goheader # mandatory copyright header
    - nestif # deeply nested if blocks
    - bodyclose # unclosed HTTP response bodies (proxy-relevant)
    - contextcheck # context propagation correctness
    - errorlint # correct errors.Is/As usage

  settings:
    funlen:
      lines: 50
      statements: 40
      ignore-comments: true
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 5
    # goconst enforces the "no magic strings" rule, but the rule is about
    # *vocabulary* — a value the code compares against, where a typo is a silent
    # behaviour change rather than a compile error. Severity levels and
    # ActionTaken values are that; the strings below are not, and naming them
    # makes the code harder to read while protecting nothing.
    #
    # Anything added here needs a reason in this comment, not just an entry.
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true
      # Kept on one line deliberately: a YAML folded scalar joins the
      # continuations with spaces, which silently turns each alternation branch
      # into " http" and stops it matching anything.
      ignore-strings: '^(true|false|http|https|h2c|tcp|udp|unix|gzip|br|deflate|linux|darwin|windows|GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS|[A-Z][a-zA-Z0-9]*(-[A-Z][a-zA-Z0-9]*)+)$'
      # true/false      — string forms of booleans in headers, env vars and
      #                   config values. `const strTrue = "true"` is worse.
      # schemes/protos  — http, https, h2c, tcp, udp, unix: comparing a scheme
      #                   to its own spelling is clearer than to an alias.
      # GOOS values     — compared against runtime.GOOS, which is itself the
      #                   literal. The stdlib does not name these either.
      # HTTP methods    — net/http already exports http.MethodGet and friends;
      #                   where a literal is used it is inside a method *list*,
      #                   and the fix there is to share the list, not the words.
      # Header-Case     — Content-Type, X-Grpc-Web and similar. The canonical
      #                   spelling is the identity of the header; a constant
      #                   adds a lookup without removing a failure mode.
    # The SPDX line is part of the mandatory header so the license of any single
    # file is unambiguous once it leaves the repository — vendored into another
    # module, copied into a container layer, or pasted into an issue. LICENSE at
    # the repo root does not travel with the file; this line does.
    goheader:
      values:
        const:
          AUTHOR: Gembit Soultan Shirazi <gembit.soultan@gmail.com>
          SPDX: MIT
        regexp:
          YEAR: 20\d\d
      template: |-
        Copyright (c) {{ YEAR }} {{ AUTHOR }}. All rights reserved.
        SPDX-License-Identifier: {{ SPDX }}

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Table-driven tests are legitimately long and repeat literals; the
      # complexity and magic-string limits target production code.
      - path: _test\.go
        linters:
          - funlen
          - cyclop
          - gocognit
          - nestif
          - goconst
          - errcheck
      # Generated protobuf/connect stubs are not ours to reshape.
      - path: (^|/)(proto|gen)/
        linters:
          - funlen
          - cyclop
          - gocognit
          - goconst
          - goheader
          - errorlint
    paths:
      - ui
      - third_party
      - internal/ai/models

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ui
      - third_party
      - internal/ai/models

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
