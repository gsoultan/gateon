#
# A drop-in for gateon.service that grants what eBPF (ADR 0018) and HA's
# virtual IP need, and nothing else (ADR 0049). The unit grants neither by
# default: both features are off by default, and CAP_NET_ADMIN is interface,
# route and firewall control on a process that terminates hostile traffic.
#
# Enable it, then turn eBPF or HA on in gateon's own settings:
#   mkdir -p /etc/systemd/system/gateon.service.d
#   ln -s /usr/share/gateon/systemd/ebpf-ha.conf /etc/systemd/system/gateon.service.d/
#   systemctl daemon-reload && systemctl restart gateon
#
# Capability and system-call lists in a drop-in are added to the unit's.
[Service]
# CAP_BPF for the programs and maps; CAP_NET_ADMIN to attach them at XDP or TC,
# and for HA's `ip addr` to move the virtual IP.
AmbientCapabilities=CAP_BPF CAP_NET_ADMIN
CapabilityBoundingSet=CAP_BPF CAP_NET_ADMIN
# Kernels before 5.11 charge BPF maps to RLIMIT_MEMLOCK, which a process that
# is not root cannot raise for itself.
LimitMEMLOCK=infinity
# bpf(2) is not in @system-service.
SystemCallFilter=bpf
