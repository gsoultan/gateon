version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/gsoultan/gateon/proto
plugins:
  - name: go
    out: proto
    opt: paths=source_relative
  - name: go-grpc
    out: proto
    opt: paths=source_relative
  - name: connect-go
    out: proto
    opt: paths=source_relative
  - name: es
    out: ui/src/services/gen
    opt: target=ts
  - name: connect-es
    out: ui/src/services/gen
    opt: target=ts
