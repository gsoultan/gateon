# Verifies, on real AWS ENA hardware, the claims gateon makes to operators about
# native XDP: that the driver refuses it above a page-sized MTU, and unless it is
# using at most half its queues. Those numbers were reasoned from driver
# behaviour and are quoted in the preflight; this is what checks them.
#
# ---------------------------------------------------------------------------
# WHY THIS NEVER RUNS ON pull_request
# ---------------------------------------------------------------------------
# This repository is public and this job runs on a self-hosted runner inside an
# AWS account. A workflow triggered by `pull_request` runs the workflow file and
# code from the *fork*, which would let anyone who opens a pull request execute
# arbitrary commands on that instance -- with its instance profile, its network
# position and its access to the VPC.
#
# `pull_request_target` is worse here, not better: it runs with the base repo's
# secrets.
#
# So the only triggers are manual dispatch and a schedule, both of which run code
# that is already on a branch of this repository. Do not add `pull_request`.
name: ena-verify

on:
  workflow_dispatch:
    inputs:
      interface:
        description: "Interface to probe (blank = autodetect ens5/enX0/eth0)"
        required: false
        default: ""
  # Pushes to this repository's own branches are safe in a way pull_request is
  # not: a fork cannot push here, so the code that runs is always code someone
  # with write access put on a branch. Scoped to the verification branches so an
  # unrelated push does not occupy the runner.
  push:
    branches:
      - "ci/ena-*"
  schedule:
    # Weekly. The claims only change when the kernel, the ENA driver or the
    # instance type changes, none of which happen per-commit.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  ena:
    name: ENA hardware verification
    # Deliberately only the labels every self-hosted Linux runner already has.
    # An `ena` label would be a second place for this requirement to live and to
    # drift; the test itself checks the driver, and fails rather than skips when
    # it was explicitly asked to verify and cannot. A mis-scheduled run should be
    # loud, not quietly green.
    runs-on: [self-hosted, linux]
    # Belt and braces against a fork enabling Actions and picking up the runner.
    if: github.repository == 'gsoultan/gateon'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install buf and proto plugins
        # Same source as ci.yml: versions come from go.mod's tool directive, so
        # the generators are locked in go.sum rather than pulled at @latest.
        run: go install tool

      - name: Generate proto stubs
        # internal/ebpf imports proto/gateon/v1, whose Go stubs are generated
        # rather than committed. `go generate` produces the eBPF bindings only,
        # so without this the test binary does not compile at all.
        #
        # protoc-gen-es lives in ui/node_modules, which is why bun install is
        # needed even though this job never builds the dashboard.
        run: |
          bun install --frozen-lockfile --cwd ui
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate

      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          # No gcc-multilib. It exists only on amd64 and fails outright with
          # "has no installation candidate" on arm64, which is what a Graviton
          # runner is. The other workflows get away with listing it because
          # GitHub-hosted runners are x86_64; this one is not.
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Generate eBPF bindings
        # <asm/*.h>, which <linux/types.h> pulls in, lives under the multiarch
        # triplet rather than on clang's default search path -- the job
        # gcc-multilib used to do. Naming both triplets is portable: clang
        # ignores the one that is not present. Same approach as
        # internal/ebpf/Dockerfile.gen.
        env:
          CPATH: /usr/include/aarch64-linux-gnu:/usr/include/x86_64-linux-gnu
        run: go generate ./internal/ebpf/...

      - name: Report what this host actually is
        # Printed unconditionally so a failure downstream can be read against the
        # hardware it ran on, rather than guessed at from a stack trace.
        run: |
          echo "== instance =="
          curl -s --max-time 2 -H "X-aws-ec2-metadata-token-ttl-seconds: 60" \
            -X PUT http://169.254.169.254/latest/api/token > /tmp/imds-token || true
          if [ -s /tmp/imds-token ]; then
            for f in instance-type instance-id placement/availability-zone; do
              printf '%s: ' "$f"
              curl -s --max-time 2 -H "X-aws-ec2-metadata-token: $(cat /tmp/imds-token)" \
                "http://169.254.169.254/latest/meta-data/$f" || true
              echo
            done
          else
            echo "IMDS unavailable (not EC2, or IMDSv2 blocked)"
          fi
          echo "== kernel =="
          uname -r
          echo "== interfaces =="
          ip -br link || true
          for i in ens5 enX0 eth0; do
            [ -e "/sys/class/net/$i" ] || continue
            echo "-- $i"
            ip link show "$i" | head -1
            echo "  driver: $(basename "$(readlink -f /sys/class/net/$i/device/driver 2>/dev/null)" 2>/dev/null || echo unknown)"
            echo "  rx queues: $(ls -d /sys/class/net/$i/queues/rx-* 2>/dev/null | wc -l)"
            ethtool -l "$i" 2>/dev/null || echo "  ethtool -l unavailable"
          done

      - name: Verify the ENA diagnosis against this hardware
        env:
          GATEON_VERIFY_ENA: "1"
          GATEON_VERIFY_IFACE: ${{ inputs.interface }}
        run: |
          # Built into RUNNER_TEMP rather than the checkout, and run under sudo
          # because attaching needs CAP_NET_ADMIN.
          go test -c -o "$RUNNER_TEMP/ebpf.test" ./internal/ebpf/
          sudo --preserve-env=GATEON_VERIFY_ENA,GATEON_VERIFY_IFACE \
            "$RUNNER_TEMP/ebpf.test" -test.run 'TestENA' -test.v
