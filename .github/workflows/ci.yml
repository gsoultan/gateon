name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Migrations run at startup and gateon advertises Postgres support, but the
    # suite only ever exercised SQLite — the permissive one. A service container
    # costs nothing here and turns "should work on Postgres" into a checked fact.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gateon
          POSTGRES_PASSWORD: gateon
          POSTGRES_DB: gateon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        # Full history: the lint step below uses --new-from-rev, which needs a
        # merge base to diff against, and the default shallow clone has none.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # The Linux build compiles internal/ebpf/manager_linux.go, which depends on
      # the bpf2go-generated loader; this toolchain lets `go generate` compile the
      # XDP C program and emit those bindings below.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install buf and proto plugins
        run: |
          # Versions come from the `tool` directive in go.mod, so the
          # generators are locked in go.sum and reviewed like any other
          # dependency. `@latest` made every build pull whatever upstream
          # had tagged at that moment: not reproducible, and a compromised
          # upstream tag would have landed straight in a release artifact.
          go install tool

      - name: Lint UI (accessibility gate)
        run: |
          bun install --frozen-lockfile --cwd ui
          (cd ui && bun run lint)

      - name: Generate all artifacts
        run: |
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate
          go generate ./...
          # `go mod tidy` used to run here, which let a build mutate its own
          # dependency set — the artifact could then be built against a
          # different graph than the one reviewed. Verify instead: fail if the
          # committed go.mod/go.sum are not already tidy.
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result"
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
          go mod verify

      # Lints only what this pull request changed, against its merge base.
      # Gating on the whole tree is not an option while the pre-existing debt
      # `make lint` reports is still there: every PR would fail for code it
      # never touched, and a job that always fails is one people learn to skip.
      #
      # This lives inside `build` rather than in a job of its own because
      # golangci-lint has to typecheck, and typechecking needs the generated
      # protobuf and eBPF bindings that the step above produces — they are
      # gitignored, so a standalone lint job cannot compile the project at all.
      # A separate job would mean duplicating five setup steps and would drift
      # the first time one of them changed.
      - name: Determine lint base revision
        id: lintbase
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "rev=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "rev=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed code
        run: make lint-new LINT_BASE=${{ steps.lintbase.outputs.rev }}

      - name: Build
        run: go build ./...

      - name: Security invariants
        run: ./scripts/check-security-invariants.sh

      - name: Config fields are read by something
        run: go run ./scripts/checkconfig

      - name: Test
        env:
          GATEON_TEST_POSTGRES_DSN: postgres://gateon:gateon@localhost:5432/gateon_test?sslmode=disable
        run: go test ./...

      # A ratchet on the tested surface, not a coverage target. Every serious
      # defect found in this codebase in 2026 came out of a package with no
      # tests, so the gate refuses to let that surface shrink: a package may not
      # lose its tests, and may not fall more than a point below its recorded
      # figure. Baseline in scripts/checkcoverage/baseline.txt.
      - name: Coverage ratchet
        env:
          GATEON_TEST_POSTGRES_DSN: postgres://gateon:gateon@localhost:5432/gateon_test?sslmode=disable
        run: make check-coverage

      - name: eBPF attach tests (need root)
        run: |
          # `go test ./...` above runs unprivileged, so every test that attaches
          # a real program to a real interface skips there. Attaching is the
          # only part of this subsystem that compiling cannot prove: the
          # verifier, the clsact qdisc and the filter install either work on a
          # live kernel or they do not.
          #
          # Built into RUNNER_TEMP, never the checkout, so the working-tree
          # check below stays meaningful.
          go test -c -o "$RUNNER_TEMP/ebpf.test" ./internal/ebpf/
          sudo "$RUNNER_TEMP/ebpf.test" -test.run 'TestAttachTC|TestAttachClsact' -test.v

      - name: Working tree clean after tests
        run: |
          # Four e2e tests used to build binaries into the checkout. Nothing
          # noticed, because a dirty tree is invisible to every other gate --
          # the artifacts only surfaced as mystery files in `git status`, and
          # one of them made a test fail for an unrelated-looking reason.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test run modified the working tree"
            git status --porcelain
            echo "Tests must write to t.TempDir(), never the repository."
            exit 1
          fi
          echo "working tree clean"

      - name: Benchmarks (allocs/perf regression check)
        run: go test -run '^$' -bench . -benchmem -benchtime 50000x ./pkg/proxy/ ./internal/telemetry/


  # The Playwright suite was untracked and therefore never ran anywhere. It
  # covers the dashboard — RBAC, the Security Hub, mitigation flows, diagnostics
  # — which nothing else exercises. It is a separate job because it needs
  # browsers and boots the whole gateway, and it is allowed to fail for now:
  # the suite is only just back under CI and blocking every PR on a suite whose
  # baseline nobody has seen yet would stall the queue. Remove
  # continue-on-error once a green run is the norm.
  e2e-ui:
    name: e2e-ui (playwright)
    runs-on: ubuntu-latest
    # No continue-on-error. It was added when the suite could not pass, and it
    # is what let seven failures accumulate without anyone noticing: a job that
    # cannot fail the build reports into a void. The suite is green now — 36
    # passed, 0 failed — so a red e2e means something broke, and the build
    # should say so.
    # A hard ceiling, because the suite has already demonstrated it can run
    # away: workers is 1, retries is 2, and the slowest tests allow 180s, so a
    # run where most tests time out is 104 x 3 x 180s — the better part of a
    # day — and one such run sat at 1h37m before this was added. The Playwright
    # globalTimeout below is set lower so the usual outcome is a graceful exit
    # with a report; this is the backstop for when the runner is wedged and
    # Playwright itself never gets to decide.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install buf and proto plugins
        run: |
          # Versions come from the `tool` directive in go.mod, so the
          # generators are locked in go.sum and reviewed like any other
          # dependency. `@latest` made every build pull whatever upstream
          # had tagged at that moment: not reproducible, and a compromised
          # upstream tag would have landed straight in a release artifact.
          go install tool
          bun install --frozen-lockfile --cwd ui

      - name: Generate all artifacts
        run: |
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate
          go generate ./...

      # playwright.config.ts starts gateon itself from the repo root, with the
      # e2e config and mockbin on PATH, so the binary has to exist there.
      - name: Build gateon
        run: go build -o gateon ./cmd/gateon

      # The e2e config points TLS at tests/e2e/cert.pem, which is generated
      # rather than committed — a checked-in private key is a liability even
      # when it is only for a test listener. env.go makes its own for the Go
      # suite; the Playwright harness reads these paths straight from the
      # config, so they have to exist before the gateway starts.
      - name: Generate e2e TLS certificate
        working-directory: tests/e2e
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -keyout key.pem -out cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Install Playwright and Chromium
        run: |
          bun install --frozen-lockfile --cwd tests/e2e
          cd tests/e2e && bunx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: tests/e2e
        run: bunx playwright test --reporter=list

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
