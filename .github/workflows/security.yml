name: security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan to catch newly disclosed CVEs in pinned dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --cwd ui

      - name: Install buf and proto plugins
        run: |
          # Versions come from the `tool` directive in go.mod, so the
          # generators are locked in go.sum and reviewed like any other
          # dependency. `@latest` made every build pull whatever upstream
          # had tagged at that moment: not reproducible, and a compromised
          # upstream tag would have landed straight in a release artifact.
          go install tool

      - name: Generate proto
        run: PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate

      # bpf2go compiles the XDP program with clang, and its output is not
      # committed, so the toolchain has to be present before `go generate`.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      # The scanners type-check the tree, so the generated sources have to
      # exist first: bpf2go emits loadGateon_ebpf for internal/ebpf, and the UI
      # build produces internal/ui/dist for the go:embed. Without this step
      # every scanner fails to compile rather than reporting findings, which is
      # how this workflow was red while telling us nothing. ci.yml already does
      # the same thing.
      - name: Generate all artifacts
        run: go generate ./...

      - name: Tidy go modules
        run: go mod tidy

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --cwd ui

      - name: Install buf and proto plugins
        run: |
          # Versions come from the `tool` directive in go.mod, so the
          # generators are locked in go.sum and reviewed like any other
          # dependency. `@latest` made every build pull whatever upstream
          # had tagged at that moment: not reproducible, and a compromised
          # upstream tag would have landed straight in a release artifact.
          go install tool

      - name: Generate proto
        run: PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate

      # bpf2go compiles the XDP program with clang, and its output is not
      # committed, so the toolchain has to be present before `go generate`.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      # The scanners type-check the tree, so the generated sources have to
      # exist first: bpf2go emits loadGateon_ebpf for internal/ebpf, and the UI
      # build produces internal/ui/dist for the go:embed. Without this step
      # every scanner fails to compile rather than reporting findings, which is
      # how this workflow was red while telling us nothing. ci.yml already does
      # the same thing.
      - name: Generate all artifacts
        run: go generate ./...

      - name: Tidy go modules
        run: go mod tidy

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run gosec
        # Pinned to a release tag rather than @master: an action runs arbitrary
        # code in a workflow that has repository access, so tracking a moving
        # branch means an upstream force-push or compromise executes here.
        uses: securego/gosec@v2.22.9
        with:
          # Emit SARIF for GitHub code scanning; never fail the build on
          # findings here (govulncheck/staticcheck are the hard gates).
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."

      # Best effort. Uploading SARIF writes to the code-scanning API, which on a
      # private repository requires GitHub Advanced Security; without it the step
      # fails with "Resource not accessible by integration" no matter what the
      # scan found. gosec already runs with -no-fail, so before this the *only*
      # thing that could fail this job was the upload — the job was red for a
      # reason unrelated to any finding, on every branch including main, which is
      # the fastest way to teach people to ignore a red check.
      - name: Upload gosec SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trivy filesystem scan
        # Pinned: see the gosec note above. v0.33.1 resolved but its bundled
        # installer exited 1 before downloading the Trivy binary, so the scan
        # never ran; v0.36.0 is the current release and is what @master — which
        # passes on main — resolves to.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # The gate is the table run, not the SARIF one. Writing findings to a
          # file means a failure prints progress lines and an exit code and
          # nothing else -- the comment below already recorded that this "cost a
          # long investigation once", and it cost another one: this step exited 1
          # while the table repeat of the same scan, with identical flags,
          # reported zero findings in every target, and the scan reproduces clean
          # locally in both formats. A gate whose failure cannot be read, and
          # which disagrees with the same scan run beside it, is not a gate.
          exit-code: "0"
          format: sarif
          output: trivy.sarif
          # Skip package-manager caches. ui/bunfig.toml deliberately keeps
          # bun's cache inside the project (dir = ".bun-cache"), so a CI
          # `bun install` materialises it and Trivy — which walks the working
          # tree, not the index, and so does not care that it is gitignored —
          # finds lockfiles vendored *inside* cached tarballs. Those describe
          # some other project's dependency tree, not ours: the three HIGH
          # findings this produced were `braces` and friends inside
          # ui/.bun-cache/uri-js@4.4.1/yarn.lock, which nothing here installs
          # or ships. Scanning them reports vulnerabilities no change to this
          # repository can fix, which is the fastest way to teach people to
          # ignore the scanner.
          skip-dirs: "ui/.bun-cache,**/node_modules"

      # This is the gate. Table format, so a failure names what was found in the
      # log rather than leaving an exit code to be guessed at.
      - name: Trivy findings (gate)
        if: always()
        # Pinned: see the gosec note above. v0.33.1 resolved but its bundled
        # installer exited 1 before downloading the Trivy binary, so the scan
        # never ran; v0.36.0 is the current release and is what @master — which
        # passes on main — resolves to.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: "ui/.bun-cache,**/node_modules"

      # Best effort, for the same reason as the gosec upload above.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
