name: security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan to catch newly disclosed CVEs in pinned dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --cwd ui

      - name: Install buf and proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          go install github.com/bufbuild/buf/cmd/buf@latest

      - name: Generate proto
        run: PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate

      # bpf2go compiles the XDP program with clang, and its output is not
      # committed, so the toolchain has to be present before `go generate`.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      # The scanners type-check the tree, so the generated sources have to
      # exist first: bpf2go emits loadGateon_ebpf for internal/ebpf, and the UI
      # build produces internal/ui/dist for the go:embed. Without this step
      # every scanner fails to compile rather than reporting findings, which is
      # how this workflow was red while telling us nothing. ci.yml already does
      # the same thing.
      - name: Generate all artifacts
        run: go generate ./...

      - name: Tidy go modules
        run: go mod tidy

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --cwd ui

      - name: Install buf and proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          go install github.com/bufbuild/buf/cmd/buf@latest

      - name: Generate proto
        run: PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate

      # bpf2go compiles the XDP program with clang, and its output is not
      # committed, so the toolchain has to be present before `go generate`.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      # The scanners type-check the tree, so the generated sources have to
      # exist first: bpf2go emits loadGateon_ebpf for internal/ebpf, and the UI
      # build produces internal/ui/dist for the go:embed. Without this step
      # every scanner fails to compile rather than reporting findings, which is
      # how this workflow was red while telling us nothing. ci.yml already does
      # the same thing.
      - name: Generate all artifacts
        run: go generate ./...

      - name: Tidy go modules
        run: go mod tidy

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # Emit SARIF for GitHub code scanning; never fail the build on
          # findings here (govulncheck/staticcheck are the hard gates).
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."

      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
