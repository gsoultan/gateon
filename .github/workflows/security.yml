name: security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan to catch newly disclosed CVEs in pinned dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # github/codeql-action/upload-sarif calls GET /repos/{o}/{r}/actions/runs/{id}
  # while post-processing, and without this the upload fails at the very end
  # with "Resource not accessible by integration" -- after the SARIF has been
  # validated and fingerprinted, which makes it read like a malformed report
  # rather than a missing scope.
  actions: read

# Runs on GitHub-hosted ubuntu-latest. The two scanners that type-check the tree
# (govulncheck, staticcheck) generate the bpf2go and UI artifacts first, because
# without them the generated sources do not compile and every scanner fails to
# build rather than reporting findings. The two that only read files (gosec,
# trivy) skip that setup.
jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # go generate compiles the bpf2go-generated loader, which needs the eBPF
      # toolchain; the go:embed of internal/ui/dist needs the UI build.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The scanners type-check the tree, so the generated sources have to exist
      # first: bpf2go emits loadGateon_ebpf for internal/ebpf, and the UI build
      # produces internal/ui/dist for the go:embed. Without this every scanner
      # fails to compile rather than reporting findings, which is how this
      # workflow was once red while telling us nothing.
      - name: Generate all artifacts
        run: |
          bun install --frozen-lockfile --cwd ui
          go install tool
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate
          go generate ./...

      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate all artifacts
        run: |
          bun install --frozen-lockfile --cwd ui
          go install tool
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate
          go generate ./...

      - name: Run staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Pinned rather than tracking a moving reference: an action or a tool that
      # tracks a moving reference runs arbitrary code in a workflow with
      # repository access, so an upstream force-push or compromise would execute
      # here.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.9

      # gosec parses rather than type-checks, so unlike govulncheck and
      # staticcheck it does not need the generated sources. Emit SARIF for GitHub
      # code scanning; never fail the build on findings here
      # (govulncheck/staticcheck are the hard gates).
      - name: Run gosec
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...

      # gosec v2.22.9 emits SARIF that the uploader rejects outright:
      #
      #   instance.runs[0].results[7].fixes[0].artifactChanges
      #     is not of a type(s) array
      #
      # It writes `"artifactChanges": null` where the schema requires an array,
      # and a `description` carrying only `markdown` where `text` is required.
      # One result in 177 was malformed, and it cost all 177 -- the upload is
      # all-or-nothing, so a single bad advisory field discards the entire scan.
      #
      # Only the offending `fixes` entries are dropped, not the findings and not
      # the well-formed fixes, so a gosec release that fixes this needs no change
      # here.
      - name: Repair the SARIF gosec emits
        run: |
          jq '
            .runs[].results |= map(
              if has("fixes")
              then .fixes |= map(select((.artifactChanges | type) == "array"))
              else . end
            )
            | .runs[].results |= map(
                if has("fixes") and (.fixes | length) == 0 then del(.fixes) else . end
              )
          ' gosec.sarif > gosec.upload.sarif
          before="$(jq '.runs[0].results | length' gosec.sarif)"
          after="$(jq '.runs[0].results | length' gosec.upload.sarif)"
          echo "findings: $before before, $after after"
          if [ "$before" != "$after" ]; then
            echo "::error::the SARIF repair dropped findings, which it must never do"
            exit 1
          fi

      # Best-effort, and only this step. The upload ends in
      #
      #   Code scanning is not enabled for this repository.
      #
      # which is not a workflow problem and cannot be fixed by one: this
      # repository is private, and code scanning on a private repository needs
      # GitHub Advanced Security. Until that is enabled the report has nowhere to
      # go, and failing the job for it means gosec reports as broken every run
      # while actually working perfectly.
      #
      # The scan itself still gates: `Run gosec` and the repair step fail loudly,
      # so a gosec that crashes or emits a report that lost findings is still a
      # red job. Only the delivery is tolerated.
      - name: Upload gosec SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.upload.sarif
          category: gosec

      # So the findings survive whether or not code scanning accepted them.
      - name: Upload gosec report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif
          path: gosec.upload.sarif
          retention-days: 7

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Installed from the release page, not built from source. Building it here
      # tied the scanner to whatever Go this project declares, and the 1.27 bump
      # duly broke it: v0.74.0 reaches encoding/json/v2 for json.SkipFunc, which
      # 1.27 no longer provides under GOEXPERIMENT=jsonv2, so the install failed
      # and every later step ran "trivy: command not found". A scanner that
      # cannot install is a scan that did not run, and because v0.74.0 is the
      # latest release there was no version to bump to. The two have no reason
      # to be coupled -- take the binary Aqua already ships.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      # Accepted findings are scoped per-path in .trivyignore.yaml; ui/.bun-cache
      # holds some other project's lockfiles vendored inside cached tarballs and
      # is skipped.
      - name: Trivy filesystem scan
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output trivy.sarif \
            --ignorefile .trivyignore.yaml \
            --skip-dirs "ui/.bun-cache" \
            --skip-dirs "**/node_modules"

      # The scan above writes findings to a file, so a failing run prints
      # progress lines and an exit code and nothing else. This repeats the scan
      # as a table so the log says what was found. It cannot fail the job: the
      # step above already decided that.
      - name: Show Trivy findings in the log
        if: always()
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            --format table \
            --ignorefile .trivyignore.yaml \
            --skip-dirs "ui/.bun-cache" \
            --skip-dirs "**/node_modules"
