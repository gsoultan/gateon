name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger, for the same reason ci.yml has one: a workflow that fires
  # only on an event you cannot replay is a workflow you cannot test. This one
  # had not run since it was rewritten on 2026-08-24, and nobody could find that
  # out without cutting a real tag and publishing whatever came back.
  #
  # A dispatch run builds everything a tagged run builds -- eBPF generation,
  # proto, the UI, both architectures, the archives, packages and SBOM -- and
  # then stops. Nothing is published and no tag is required.
  workflow_dispatch:

permissions:
  contents: write

# <asm/*.h>, which <linux/types.h> includes, sits under the multiarch triplet
# rather than on clang's default search path, so the BPF compile in goreleaser's
# `before` hook fails with "'asm/types.h' file not found" without this. ci.yml
# and security.yml both set it; release.yml did not, which is how a release that
# built fine everywhere else died two seconds into its first hook.
#
# Naming both triplets is portable -- clang ignores whichever is absent -- and it
# is what internal/ebpf/Dockerfile.gen has always done. gcc-multilib would also
# place the headers, but that package exists only on amd64 and apt refuses it
# outright on arm64.
env:
  CPATH: /usr/include/x86_64-linux-gnu:/usr/include/aarch64-linux-gnu

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    # This job used to run on the self-hosted Apple-silicon Mac, building inside
    # the Linux container from .github/ci/Dockerfile.ci. That runner is a single
    # laptop -- offline whenever nobody is actively running it -- and the commit
    # that moved ci and security back to ubuntu-latest left this workflow behind.
    # The result was a release path that had not run since 2026-08-24 and could
    # not run on demand: tagging queued against an offline runner and produced no
    # artifacts at all.
    #
    # It still has to be Linux. .goreleaser.yaml's `before` hook is
    # `go generate ./internal/ebpf/...`, which compiles the XDP program with a
    # BPF-target clang against Linux kernel headers; the hook fails outright on
    # macOS. ubuntu-latest is Linux natively, so the container wrapper that
    # existed only to provide Linux on a Mac is no longer buying anything.
    #
    # The old comment argued that building in the container kept published
    # binaries in "the same kind of environment that produced every release
    # before this runner move". That is now the argument for this change rather
    # than against it: every release up to and including v2.5.3 was built on a
    # GitHub-hosted Linux runner, which is exactly what this restores.
    #
    # What ships is unchanged either way. Builds set CGO_ENABLED=0 and target
    # linux/amd64 and linux/arm64, so they cross-compile from any host; the
    # bpf2go output is pure Go with the BPF object embedded, and that object is
    # arch-portable (clang -target bpf), so one generation serves both. PGO is
    # unaffected -- cmd/gateon/default.pgo is tracked in git and the toolchain
    # applies it automatically from the main package directory.

    steps:
      - name: Checkout
        # Full history: GoReleaser builds its changelog from the commit range
        # since the previous tag, which a shallow clone does not contain.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # .goreleaser.yaml's `before` hook runs `go generate ./internal/ebpf/...`,
      # which needs a BPF-target clang and the kernel headers to compile the XDP
      # program and emit the bpf2go bindings that manager_linux.go embeds.
      # Without this the release build fails in the hook, before it compiles a
      # single binary.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install buf, proto plugins and UI dependencies
        # Versions come from the `tool` directive in go.mod, so the generators
        # are locked in go.sum and reviewed like any other dependency.
        # `@latest` made a release build pull whatever upstream had tagged at
        # that moment: not reproducible, and a compromised upstream tag would
        # have been compiled straight into a published artifact.
        run: |
          go install tool
          bun install --frozen-lockfile --cwd ui

      - name: Generate proto and build the UI
        run: |
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate
          (cd ui && bun run build)
          go run ./scripts/sync_assets.go

      - name: Verify modules are tidy
        run: |
          # `go mod tidy` used to run here, which let a build mutate its own
          # dependency set -- the artifact could then be built against a
          # different graph than the one reviewed. Verify instead: fail if the
          # committed go.mod/go.sum are not already tidy.
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result"
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
          go mod verify

      # Both are pinned for the same reason every other tool in this repository
      # is: a release build must not depend on whatever upstream tagged most
      # recently.
      #
      # Both as pinned upstream release binaries rather than `go install`.
      # Syft's module graph pulls containerd and most of its dependencies, and
      # building it here took minutes before dying on `connection reset by peer`
      # from the module proxy -- a release that fails on a transient network
      # error while compiling a tool it only shells out to. The tarballs take
      # seconds and are the same artifacts anchore/sbom-action was fetching.
      #
      # They land in GOPATH/bin because actions/setup-go puts that on PATH.
      - name: Install Syft (SBOM generator) and GoReleaser
        run: |
          SYFT_VERSION=1.51.0
          GORELEASER_VERSION=2.17.1
          case "$(dpkg --print-architecture)" in
            arm64) syftarch=arm64; grarch=arm64 ;;
            amd64) syftarch=amd64; grarch=x86_64 ;;
            *) echo "::error::unsupported architecture for Syft/GoReleaser"; exit 1 ;;
          esac
          mkdir -p "$(go env GOPATH)/bin"
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_${syftarch}.tar.gz" \
            | tar -xz -C "$(go env GOPATH)/bin" syft
          curl -sSfL "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Linux_${grarch}.tar.gz" \
            | tar -xz -C "$(go env GOPATH)/bin" goreleaser
          syft --version
          goreleaser --version | head -3

      # A tag publishes. A manual dispatch builds the identical pipeline and
      # throws the result away: --snapshot lets GoReleaser run without a tag,
      # and --skip=publish stops it uploading. Both paths run the same `before`
      # hook and the same builds, so a dispatch that passes is real evidence the
      # next tag will too.
      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::dry run - building every artifact, publishing none"
            goreleaser release --snapshot --clean --skip=publish
          else
            goreleaser release --clean
          fi

      # Only on a dry run: the artifacts have nowhere else to go, and being able
      # to download and inspect them is the point of having one.
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dry-run
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
