name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger, for the same reason ci.yml has one: a workflow that fires
  # only on an event you cannot replay is a workflow you cannot test. This one
  # had not run since it was rewritten on 2026-08-24, and nobody could find that
  # out without cutting a real tag and publishing whatever came back.
  #
  # A dispatch run builds everything a tagged run builds -- eBPF generation,
  # proto, the UI, both architectures, the archives, packages and SBOM, and the
  # container image from those archives -- and then stops. The image is pushed
  # to a registry that lives only inside the job, pulled back by digest and run,
  # exactly as a tag's is from ghcr.io. Nothing is published and no tag is
  # required.
  #
  # With publish_tag set, a dispatch instead publishes the image for a release
  # that already exists -- v1.1.0 shipped before images were published -- from
  # that release's own tarballs, through the same steps a tag push runs. It
  # refuses anything that is not an existing, published release tag, and runs
  # only from main (ADR 0065).
  workflow_dispatch:
    inputs:
      publish_tag:
        description: >-
          Publish the container image for this existing release tag (e.g.
          v1.1.0). Leave empty for the dry run, which publishes nothing.
        required: false
        default: ""
        type: string

# Read-only by default; each job asks for what it needs. Only the goreleaser job
# writes releases, and only the image job can push packages -- so the dry run,
# which any branch can dispatch, holds neither.
permissions:
  contents: read

# <asm/*.h>, which <linux/types.h> includes, sits under the multiarch triplet
# rather than on clang's default search path, so the BPF compile in goreleaser's
# `before` hook fails with "'asm/types.h' file not found" without this. ci.yml
# and security.yml both set it; release.yml did not, which is how a release that
# built fine everywhere else died two seconds into its first hook.
#
# Naming both triplets is portable -- clang ignores whichever is absent -- and it
# is what internal/ebpf/Dockerfile.gen has always done. gcc-multilib would also
# place the headers, but that package exists only on amd64 and apt refuses it
# outright on arm64.
env:
  CPATH: /usr/include/x86_64-linux-gnu:/usr/include/aarch64-linux-gnu

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Not when publishing an existing tag's image: that release is already
    # built and published, and its image is made from what it published.
    if: github.event_name == 'push' || inputs.publish_tag == ''
    permissions:
      contents: write

    # This job used to run on the self-hosted Apple-silicon Mac, building inside
    # the Linux container from .github/ci/Dockerfile.ci. That runner is a single
    # laptop -- offline whenever nobody is actively running it -- and the commit
    # that moved ci and security back to ubuntu-latest left this workflow behind.
    # The result was a release path that had not run since 2026-08-24 and could
    # not run on demand: tagging queued against an offline runner and produced no
    # artifacts at all.
    #
    # It still has to be Linux. .goreleaser.yaml's `before` hook is
    # `go generate ./internal/ebpf/...`, which compiles the XDP program with a
    # BPF-target clang against Linux kernel headers; the hook fails outright on
    # macOS. ubuntu-latest is Linux natively, so the container wrapper that
    # existed only to provide Linux on a Mac is no longer buying anything.
    #
    # The old comment argued that building in the container kept published
    # binaries in "the same kind of environment that produced every release
    # before this runner move". That is now the argument for this change rather
    # than against it: every release up to and including v2.5.3 was built on a
    # GitHub-hosted Linux runner, which is exactly what this restores.
    #
    # What ships is unchanged either way. Builds set CGO_ENABLED=0 and target
    # linux/amd64 and linux/arm64, so they cross-compile from any host; the
    # bpf2go output is pure Go with the BPF object embedded, and that object is
    # arch-portable (clang -target bpf), so one generation serves both. PGO is
    # unaffected -- cmd/gateon/default.pgo is tracked in git and the toolchain
    # applies it automatically from the main package directory.

    steps:
      - name: Checkout
        # Full history: GoReleaser builds its changelog from the commit range
        # since the previous tag, which a shallow clone does not contain.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # .goreleaser.yaml's `before` hook runs `go generate ./internal/ebpf/...`,
      # which needs a BPF-target clang and the kernel headers to compile the XDP
      # program and emit the bpf2go bindings that manager_linux.go embeds.
      # Without this the release build fails in the hook, before it compiles a
      # single binary.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install buf, proto plugins and UI dependencies
        # Versions come from the `tool` directive in go.mod, so the generators
        # are locked in go.sum and reviewed like any other dependency.
        # `@latest` made a release build pull whatever upstream had tagged at
        # that moment: not reproducible, and a compromised upstream tag would
        # have been compiled straight into a published artifact.
        run: |
          go install tool
          bun install --frozen-lockfile --cwd ui

      - name: Generate proto and build the UI
        run: |
          PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate
          (cd ui && bun run build)
          go run ./scripts/sync_assets.go

      - name: Verify modules are tidy
        run: |
          # `go mod tidy` used to run here, which let a build mutate its own
          # dependency set -- the artifact could then be built against a
          # different graph than the one reviewed. Verify instead: fail if the
          # committed go.mod/go.sum are not already tidy.
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result"
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
          go mod verify

      # Both are pinned for the same reason every other tool in this repository
      # is: a release build must not depend on whatever upstream tagged most
      # recently.
      #
      # Both as pinned upstream release binaries rather than `go install`.
      # Syft's module graph pulls containerd and most of its dependencies, and
      # building it here took minutes before dying on `connection reset by peer`
      # from the module proxy -- a release that fails on a transient network
      # error while compiling a tool it only shells out to. The tarballs take
      # seconds and are the same artifacts anchore/sbom-action was fetching.
      #
      # They land in GOPATH/bin because actions/setup-go puts that on PATH.
      - name: Install Syft (SBOM generator) and GoReleaser
        run: |
          SYFT_VERSION=1.51.0
          GORELEASER_VERSION=2.17.1
          case "$(dpkg --print-architecture)" in
            arm64) syftarch=arm64; grarch=arm64 ;;
            amd64) syftarch=amd64; grarch=x86_64 ;;
            *) echo "::error::unsupported architecture for Syft/GoReleaser"; exit 1 ;;
          esac
          mkdir -p "$(go env GOPATH)/bin"
          curl -sSfL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_${syftarch}.tar.gz" \
            | tar -xz -C "$(go env GOPATH)/bin" syft
          curl -sSfL "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Linux_${grarch}.tar.gz" \
            | tar -xz -C "$(go env GOPATH)/bin" goreleaser
          syft --version
          goreleaser --version | head -3

      # A tag publishes. A manual dispatch builds the identical pipeline and
      # throws the result away: --snapshot lets GoReleaser run without a tag,
      # and --skip=publish stops it uploading. Both paths run the same `before`
      # hook and the same builds, so a dispatch that passes is real evidence the
      # next tag will too.
      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::dry run - building every artifact, publishing none"
            goreleaser release --snapshot --clean --skip=publish
          else
            goreleaser release --clean
          fi

      # Only on a dry run: the artifacts have nowhere else to go, and being able
      # to download and inspect them is the point of having one.
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dry-run
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sbom.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  # The container image, published (ADR 0065). It compiles nothing: it copies
  # the binary out of the release's own linux tarballs, after checking them
  # against the release's checksums.txt, onto distroless/static:nonroot -- so
  # the image's binary is byte-for-byte the tarball's, with the tarball's PGO,
  # -trimpath, CGO_ENABLED=0 and version stamp. packaging/image/build.sh does
  # every step; this job only decides where the tarballs come from.
  #
  # A tag push takes them from the release goreleaser just published. A
  # dispatch with publish_tag takes them from that existing release. Either way
  # the image is built for linux/amd64 and linux/arm64, pushed with an SBOM and
  # a provenance attestation, then pulled back by digest and run on each
  # platform (arm64 under QEMU): it must hold the tarball's exact binary, run as
  # uid 65532, serve /healthz and drain on SIGTERM. A failure there fails the
  # release visibly even though the push has happened.
  image:
    needs: goreleaser
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.goreleaser.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # actions/attest-build-provenance: a Sigstore-signed provenance statement
      # for the pushed digest, verifiable with `gh attestation verify`.
      id-token: write
      attestations: write
    # Two publishes of one tag must not interleave their pushes.
    concurrency:
      group: release-image-${{ github.event_name == 'push' && github.ref_name || inputs.publish_tag }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/gsoultan/gateon
      # Through the environment, never interpolated into a script: it is a
      # free-text dispatch input.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.publish_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A dispatch runs the workflow file of the branch it names. Publishing
      # under the project's image name is for what main has reviewed.
      - name: Publish only from main or a tag
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish_tag runs only from main (this run is on ${GITHUB_REF}); dispatch it with --ref main"
          exit 1

      - name: Checkout
        # Full history and tags: resolve reads the tag list and the tag's commit.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        # For `go version -m`, which reads the tarball binaries' build settings.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Self-test the image script and check the runtime stages agree
        run: |
          packaging/image/build.sh selftest
          packaging/image/build.sh parity

      - name: Resolve the release tag
        id: resolve
        # Refuses anything that is not an existing, published (non-draft)
        # release tag. Prints the version, the tag's commit and time, and the
        # image tags: X.Y.Z always; X.Y and latest only for a non-prerelease
        # that is the newest patch of its line / GitHub's Latest release.
        run: packaging/image/build.sh resolve | tee -a "$GITHUB_OUTPUT"

      # The image of an older tag is described by that tag's own image
      # definition when it has one; v1.1.0 predates packaging/image, so it uses
      # this commit's, whose runtime stage parity has just checked.
      - name: Use the tag's own image definition when it has one
        run: |
          if git cat-file -e "${TAG}:packaging/image/Dockerfile" 2>/dev/null; then
            git show "${TAG}:packaging/image/Dockerfile" > packaging/image/Dockerfile
            echo "::notice::building with ${TAG}'s packaging/image/Dockerfile"
          else
            echo "::notice::${TAG} predates packaging/image/Dockerfile; building with $(git rev-parse --short HEAD)'s"
          fi

      - name: Download the release's tarballs and checksums
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir archives \
            --pattern "gateon_${VERSION}_linux_amd64.tar.gz" \
            --pattern "gateon_${VERSION}_linux_arm64.tar.gz" \
            --pattern checksums.txt
          ls -l archives

      - name: Stage the build context from the tarballs
        env:
          ARCHIVES: archives
          CONTEXT: ${{ runner.temp }}/image-context
          VERSION: ${{ steps.resolve.outputs.version }}
          REVISION: ${{ steps.resolve.outputs.revision }}
        run: packaging/image/build.sh stage

      - name: Set up QEMU (to run the arm64 image in verify)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN with packages: write -- no personal token. --password-stdin
      # keeps it out of the process list; Actions masks it in the log.
      - name: Log in to ghcr.io
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        id: build
        env:
          CONTEXT: ${{ runner.temp }}/image-context
          TAGS: ${{ steps.resolve.outputs.tags }}
          VERSION: ${{ steps.resolve.outputs.version }}
          REVISION: ${{ steps.resolve.outputs.revision }}
          CREATED: ${{ steps.resolve.outputs.created }}
        run: packaging/image/build.sh build | tee -a "$GITHUB_OUTPUT"

      - name: Pull back by digest and run each platform
        env:
          CONTEXT: ${{ runner.temp }}/image-context
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: packaging/image/build.sh verify

      # After verify, so a digest that failed it is never attested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: success()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.resolve.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE} for ${TAG}"
            echo
            echo "Digest \`${DIGEST}\`, tags: \`${TAGS}\`"
            echo
            echo '```'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner gsoultan"
            echo '```'
            echo
            echo "A new GHCR package can start private; its visibility is set in the"
            echo "package's settings and is the repository owner's decision."
          } >> "$GITHUB_STEP_SUMMARY"

  # The dry run of the job above: the same script, on the dry run's snapshot
  # tarballs, pushed to a registry that exists only inside this job (no
  # credentials, nothing leaves the runner), then pulled back by digest and run
  # on both platforms. What differs from a tag is the tarballs' origin and the
  # registry's name -- not one build, attestation or verify step.
  image-dry-run:
    needs: goreleaser
    if: github.event_name == 'workflow_dispatch' && inputs.publish_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/gateon
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Self-test the image script and check the runtime stages agree
        run: |
          packaging/image/build.sh selftest
          packaging/image/build.sh parity

      - name: Download the dry run's tarballs and checksums
        uses: actions/download-artifact@v4
        with:
          name: goreleaser-dry-run
          path: archives

      - name: Stage the build context from the tarballs
        id: stage
        env:
          ARCHIVES: archives
          CONTEXT: ${{ runner.temp }}/image-context
          REVISION: ${{ github.sha }}
        run: packaging/image/build.sh stage | tee -a "$GITHUB_OUTPUT"

      - name: Set up QEMU (to run the arm64 image in verify)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # network=host lets the BuildKit container reach the job's registry on
      # localhost:5000, which it treats as plain HTTP.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build and push linux/amd64 + linux/arm64 (job-local registry)
        id: build
        env:
          CONTEXT: ${{ runner.temp }}/image-context
          # A snapshot version can carry a branch name; these are always valid.
          TAGS: dry-run latest
          VERSION: ${{ steps.stage.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          CREATED="$(git log -1 --format=%ct HEAD)" packaging/image/build.sh build | tee -a "$GITHUB_OUTPUT"

      - name: Pull back by digest and run each platform
        env:
          CONTEXT: ${{ runner.temp }}/image-context
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: packaging/image/build.sh verify
