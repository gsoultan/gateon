name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Required so GoReleaser's `before` hook (go generate ./internal/ebpf/...)
      # can compile the XDP/eBPF C program and embed the object into the binary.
      - name: Install eBPF build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev gcc-multilib
          # Ensure llvm-strip is in the path (some Ubuntu versions use versioned binaries)
          STRIP_BIN=$(command -v llvm-strip || command -v llvm-strip-14 || command -v llvm-strip-15 || command -v llvm-strip-16 || command -v llvm-strip-17 || command -v llvm-strip-18)
          if [ -n "$STRIP_BIN" ] && [ ! -f /usr/bin/llvm-strip ]; then
            sudo ln -s "$STRIP_BIN" /usr/bin/llvm-strip
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install proto plugins
        run: |
          # Versions come from the `tool` directive in go.mod, so the generators
          # are locked in go.sum and reviewed like any other dependency.
          # `@latest` made a release build pull whatever upstream had tagged at
          # that moment: not reproducible, and a compromised upstream tag would
          # have been compiled straight into a published artifact.
          go install tool

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --cwd ui

      - name: Generate proto
        run: PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/ui/node_modules/.bin buf generate

      - name: Build UI
        run: |
          (cd ui && bun run build)
          go run ./scripts/sync_assets.go

      - name: Verify modules are tidy
        run: |
          # `go mod tidy` used to run here, which let a build mutate its own
          # dependency set — the artifact could then be built against a
          # different graph than the one reviewed. Verify instead: fail if the
          # committed go.mod/go.sum are not already tidy.
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null || ! diff -q go.sum go.sum.bak >/dev/null; then
            echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result"
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi
          rm -f go.mod.bak go.sum.bak
          go mod verify

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
