syntax = "proto3";

package gateon.v1;

option go_package = "github.com/gsoultan/gateon/proto/gateon/v1;gateonv1";

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string version = 2;
  int64 uptime = 3;
  int64 memory_usage = 4;
  int32 routes_count = 5;
  int32 services_count = 6;
  int32 entry_points_count = 7;
  int32 middlewares_count = 8;
  double cpu_usage = 9;
  double memory_usage_percent = 10;
  int32 cpu_cores = 11;
  double memory_total_gb = 12;
  double storage_usage_gb = 13;
  double storage_total_gb = 14;
  double storage_usage_percent = 15;
  bool clamav_installed = 16;
  // Current active resource profile tier: "minimal" | "standard" | "enterprise"
  string profile = 17;
  // If true, the profile is pinned by GATEON_PROFILE environment variable.
  bool profile_pinned = 18;
}

// UpdateCheckState is where the release check stands.
enum UpdateCheckState {
  UPDATE_CHECK_STATE_UNSPECIFIED = 0;
  // No check has finished since the gateway started.
  UPDATE_CHECK_STATE_PENDING = 1;
  // The last check read a release the gateway accepts.
  UPDATE_CHECK_STATE_OK = 2;
  // The last check failed; failure says how.
  UPDATE_CHECK_STATE_FAILED = 3;
  // Checking is switched off, in the settings or by GATEON_UPDATE_CHECK.
  UPDATE_CHECK_STATE_DISABLED = 4;
}

// UpdateSignature is what the gateway could establish about the release list
// it read.
enum UpdateSignature {
  UPDATE_SIGNATURE_UNSPECIFIED = 0;
  // Signed by a release key compiled into this binary.
  UPDATE_SIGNATURE_VERIFIED = 1;
  // This binary was built with no release key, so nothing can be verified.
  UPDATE_SIGNATURE_NO_KEY = 2;
}

// UpdateFailure is why a check failed.
enum UpdateFailure {
  UPDATE_FAILURE_UNSPECIFIED = 0;
  // The release source did not answer, or answered with an error.
  UPDATE_FAILURE_UNREACHABLE = 1;
  // The release list carries no signature from a key this binary trusts.
  UPDATE_FAILURE_SIGNATURE = 2;
  // The release list is not one the gateway can read.
  UPDATE_FAILURE_MALFORMED = 3;
  // The configured release source is not one the gateway will fetch.
  UPDATE_FAILURE_SOURCE = 4;
}

// InstallKind is how this gateway was installed, which decides how it is
// upgraded.
enum InstallKind {
  INSTALL_KIND_UNSPECIFIED = 0;
  // A systemd service, from the package or `gateon install`.
  INSTALL_KIND_SYSTEMD = 1;
  // A container outside Kubernetes.
  INSTALL_KIND_CONTAINER = 2;
  // A pod in Kubernetes.
  INSTALL_KIND_KUBERNETES = 3;
  // Anything else: a binary started by hand, or a Windows service.
  INSTALL_KIND_OTHER = 4;
}

// UpdateStatus is what the gateway knows about newer releases (ADR 0085).
message UpdateStatus {
  // The running version, as GetStatusResponse.version reports it.
  string current_version = 1;
  // The newest release the source lists, "1.8.3". Empty until a check has
  // succeeded, and after one that failed on its signature.
  string latest_version = 2;
  // latest_version is newer than current_version. Never true for a build
  // that is not a release, whose version cannot be compared.
  bool update_available = 3;
  UpdateSignature signature = 4;
  // When the last check finished, in Unix seconds. 0: none has.
  int64 checked_at = 5;
  UpdateCheckState state = 6;
  UpdateFailure failure = 7;
  // The release notes of latest_version. Empty with it.
  string release_notes_url = 8;
  // The release source in force.
  string source_url = 9;
  InstallKind install_kind = 10;
  // GATEON_UPDATE_CHECK switched checking off, so the setting cannot turn it
  // back on.
  bool disabled_by_env = 11;
  // current_version is a release version. False for a development build.
  bool release_build = 12;
  // Whether this gateway can install a release, the install in hand or the
  // last one, and what came before it (ADR 0087).
  UpgradeStatus upgrade = 13;
}

// UpdateScope is how far from the running release an automatic install may
// go.
enum UpdateScope {
  // Patch releases only, as UPDATE_SCOPE_PATCH. GATEON_UPDATE_AUTO_SCOPE
  // names another default.
  UPDATE_SCOPE_UNSPECIFIED = 0;
  // 1.8.2 to 1.8.3, never to 1.9.0.
  UPDATE_SCOPE_PATCH = 1;
  // To any release of the same major version.
  UPDATE_SCOPE_MINOR = 2;
  // To any newer release.
  UPDATE_SCOPE_MAJOR = 3;
}

// UpgradePhase is where an install stands.
enum UpgradePhase {
  // Nothing has been installed by this gateway and nothing is being.
  UPGRADE_PHASE_UNSPECIFIED = 0;
  // The gateway is downloading the release and checking its signature.
  UPGRADE_PHASE_DOWNLOADING = 1;
  // The release is verified and waiting for the root-owned helper.
  UPGRADE_PHASE_REQUESTED = 2;
  // The helper is verifying the release again and replacing the binary.
  UPGRADE_PHASE_INSTALLING = 3;
  // The new binary is in place; the helper waits for it to report ready.
  UPGRADE_PHASE_RESTARTING = 4;
  // The new binary did not become ready; the previous one is being put back.
  UPGRADE_PHASE_ROLLING_BACK = 5;
  UPGRADE_PHASE_SUCCEEDED = 6;
  // The previous binary is back in place.
  UPGRADE_PHASE_ROLLED_BACK = 7;
  // Nothing was installed. reason says why.
  UPGRADE_PHASE_REFUSED = 8;
  // The new binary is installed, did not report ready, and was not rolled
  // back. reason says why.
  UPGRADE_PHASE_FAILED = 9;
}

// UpgradeReason is why an install was refused, rolled back or left failed.
enum UpgradeReason {
  UPGRADE_REASON_UNSPECIFIED = 0;
  // The release list is not signed by a key the installed binary trusts.
  UPGRADE_REASON_SIGNATURE = 1;
  // The archive is not the one the signed list names.
  UPGRADE_REASON_CHECKSUM = 2;
  // The release list or the archive cannot be read.
  UPGRADE_REASON_MALFORMED = 3;
  // The release is not newer than the installed one.
  UPGRADE_REASON_NOT_NEWER = 4;
  // The installed binary carries no release key.
  UPGRADE_REASON_NO_KEY = 5;
  // The binary could not be put in place.
  UPGRADE_REASON_INSTALL = 6;
  // The new binary did not report ready in time.
  UPGRADE_REASON_NOT_READY = 7;
  // The new binary changed a database that cannot be put back (PostgreSQL,
  // or SQLite with the pre-migration copy switched off), so the previous
  // binary was not put back either.
  UPGRADE_REASON_MIGRATED = 8;
  // The release could not be downloaded.
  UPGRADE_REASON_DOWNLOAD = 9;
  // The helper did not pick the request up: gateon-upgrade.path is not
  // enabled.
  UPGRADE_REASON_HELPER = 10;
}

// UpgradeBlocker is why this gateway cannot install a release itself.
enum UpgradeBlocker {
  // It can.
  UPGRADE_BLOCKER_UNSPECIFIED = 0;
  // A container, a pod, or a binary started by hand: whatever started it
  // decides its version.
  UPGRADE_BLOCKER_ORCHESTRATED = 1;
  // A systemd service without the upgrade helper units.
  UPGRADE_BLOCKER_NO_HELPER = 2;
  // Built with no release key, so it can verify nothing.
  UPGRADE_BLOCKER_NO_KEY = 3;
  // Not a release build, so no release is newer than it.
  UPGRADE_BLOCKER_DEVELOPMENT_BUILD = 4;
}

// UpgradeRecord is one install.
message UpgradeRecord {
  UpgradePhase phase = 1;
  UpgradeReason reason = 2;
  // The release being installed, and the one it replaces.
  string target_version = 3;
  string previous_version = 4;
  // Unix seconds. finished_at is 0 while the install is running.
  int64 started_at = 5;
  int64 finished_at = 6;
  // Who asked, as the gateway recorded it. Empty for an automatic install.
  string requested_by = 7;
  bool automatic = 8;
  // The previous gateway was told to put back the SQLite copy taken before
  // the migration, and reported ready after doing so.
  bool database_restored = 9;
}

// UpgradeStatus is what the gateway knows about installing releases.
message UpgradeStatus {
  UpgradeBlocker blocker = 1;
  // The install in hand, or the last one. Unset when there has been none.
  UpgradeRecord current = 2;
  // Finished installs, newest first, at most twenty.
  repeated UpgradeRecord history = 3;
  // The automatic-install policy in force, after the environment and the
  // profile's defaults.
  bool auto_install = 4;
  // GATEON_UPDATE_AUTO_INSTALL decided auto_install, so the setting cannot.
  bool auto_install_by_env = 5;
  UpdateScope auto_install_scope = 6;
  // The maintenance window in force, "HH:MM" local time.
  string window_start = 7;
  string window_end = 8;
}

message GetUpdateStatusRequest {}

message GetUpdateStatusResponse {
  UpdateStatus status = 1;
}

message CheckForUpdateRequest {}

message CheckForUpdateResponse {
  UpdateStatus status = 1;
}

// InstallUpdateRequest asks the gateway to install a release (ADR 0087).
message InstallUpdateRequest {
  // The release to install, "1.8.3". It must be the newest release the last
  // check verified: the caller names what they were shown, and a release
  // that appeared since is not installed in its place.
  string version = 1;
}

message InstallUpdateResponse {
  UpdateStatus status = 1;
}
