syntax = "proto3";

package gateon.v1;

option go_package = "github.com/gsoultan/gateon/proto/gateon/v1;gateonv1";

message ListRoutesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message ListRoutesResponse {
  repeated Route routes = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateRouteRequest {
  Route route = 1;
}

message UpdateRouteResponse {
  bool success = 1;
}

message DeleteRouteRequest {
  string id = 1;
}

message DeleteRouteResponse {
  bool success = 1;
}

message Route {
  string id = 1;
  string name = 2;
  string type = 3; // "http", "grpc", "graphql", "tcp", "udp"
  repeated string entrypoints = 4;
  string rule = 5;  // For L4 routes use "L4()" (matching by entrypoint only)
  int32 priority = 6;
  repeated string middlewares = 7;
  string service_id = 8;
  RouteTLSConfig tls = 9;
  bool disabled = 10; // When true, route is not matched (paused)

  // StreamMode says which of this route's responses are streams: lifted off
  // the entrypoint's read and write timeouts and bounded instead by the stream
  // idle timeout and maximum lifetime (ADR 0042, ADR 0064). It never removes
  // every bound -- a stream is always ended by those two.
  enum StreamMode {
    // A 200 whose Content-Type is text/event-stream and that declares no
    // Content-Length (ADR 0062, DP-N7). What every route did before this
    // field existed, and what an unset value still means.
    STREAM_MODE_AUTO = 0;
    // Every response this route answers, once its status is written: for a
    // backend that streams under another type (NDJSON, chunked long-poll,
    // gRPC-Web). The backend must still answer within the write timeout.
    STREAM_MODE_ALWAYS = 1;
    // No response: the entrypoint's timeouts bound every response, an event
    // stream included.
    STREAM_MODE_NEVER = 2;
  }
  StreamMode stream_mode = 11;
}

message RouteTLSConfig {
  repeated string certificate_ids = 1;
  string option_id = 2;
  bool acme_enabled = 3;
}
