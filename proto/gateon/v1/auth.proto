syntax = "proto3";

package gateon.v1;

option go_package = "github.com/gsoultan/gateon/proto/gateon/v1;gateonv1";

import "gateon/v1/common.proto";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message IsSetupRequiredRequest {
  // setup_token, when it is the first-run setup token, asks for
  // database_description as well. Without it the answer says only whether a
  // database is configured and which engine: the question is public, and the
  // address of a configuration database is not for whoever reaches the
  // management port first. See ADR 0057.
  string setup_token = 1;
}

message IsSetupRequiredResponse {
  bool required = 1;
  // database_configured is true when this gateway already has its user
  // database open -- the one its configuration names, the Helm chart's
  // externalDatabase among them. Setup creates the administrator there and
  // keeps it: a SetupRequest naming a different management or logging
  // database is refused. Only answered while setup is required. ADR 0057.
  bool database_configured = 2;
  // database_driver is the configured database's engine ("postgres",
  // "sqlite"), when database_configured.
  string database_driver = 3;
  // database_description names the configured database without its
  // credentials (host, port and database, or the SQLite file), and only to a
  // request that carries the setup token.
  string database_description = 4;
  // logging_database_description is the configured audit database when it is
  // not the management database, under the same rule.
  string logging_database_description = 5;
  // session_key_from_environment is true when the configuration names the
  // session key by reference (GATEON_SESSION_KEY, ADR 0056). Setup keeps that
  // key and ignores SetupRequest.paseto_secret, so a wizard must not show a
  // generated key as the one in use.
  bool session_key_from_environment = 6;
}

// SetupRequest is the initial configuration request to initialize the Gateon server.
message SetupRequest {
  // AdminUsername is the username for the first administrator account.
  string admin_username = 1;
  // AdminPassword is the password for the first administrator account.
  string admin_password = 2;
  // PasetoSecret is the 32-character secret key for signing PASETO tokens.
  string paseto_secret = 3;
  // ManagementBind is the initial bind address for the management API.
  string management_bind = 4;
  // ManagementPort is the initial port for the management API.
  string management_port = 5;
  reserved 6;
  reserved "management_host";

  // DatabaseUrl is an optional connection string for the management/auth database.
  // If provided, it overrides DatabaseConfig.
  // Supported: plain sqlite path (e.g. "gateon.db"),
  //            sqlite://path/to.db, postgres://...
  string database_url = 7;

  // DatabaseConfig is an optional structured database configuration.
  // When DatabaseUrl is empty, this config is used to construct the DSN.
  DatabaseConfig database_config = 8;

  // LoggingDatabaseUrl is an optional connection string for a dedicated audit
  // and security-log database. If provided, it overrides LoggingDatabaseConfig.
  // Leaving both empty keeps the logs in the management database.
  string logging_database_url = 9;

  // LoggingDatabaseConfig is the structured form of LoggingDatabaseUrl, used to
  // construct the DSN when LoggingDatabaseUrl is empty.
  DatabaseConfig logging_database_config = 10;

  // SetupToken is the one-time token first-run setup requires: printed in the
  // gateway's log at startup and written to setup-token in its data directory,
  // or the value of GATEON_SETUP_TOKEN. The wizard's connection test, which
  // decodes this message too, requires it as well. See ADR 0021.
  string setup_token = 11;
}

message SetupResponse {
  bool success = 1;
  string error = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  bool two_factor_required = 3;
  // two_factor_setup_required is true when an administrator has mandated 2FA for
  // this account but the user has not yet enrolled. The client must walk the user
  // through first-time TOTP enrollment before a session is issued.
  bool two_factor_setup_required = 4;
  // two_factor_challenge proves the password step, and is set whenever
  // two_factor_required or two_factor_setup_required is. The second step
  // (POST /v1/auth/2fa/verify) requires it: without it an account id and one
  // code were a whole sign-in. It is not a session -- nothing but that step
  // accepts it -- it names one account, it lasts five minutes, and a password,
  // role or disabled change or a sign-out voids it. See ADR 0039.
  string two_factor_challenge = 5;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateUserRequest {
  User user = 1;
}

message UpdateUserResponse {
  bool success = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

// ResetUserTwoFactorRequest removes another account's second factor: its TOTP
// secret and recovery codes. The account must enrol a new authenticator at its
// next sign-in, and every session it has ends. Administrators only, and never
// for the caller's own account, which re-enrols from its profile with its
// password. See ADR 0057.
message ResetUserTwoFactorRequest {
  string id = 1;
}

message ResetUserTwoFactorResponse {
  bool success = 1;
}

message ChangePasswordRequest {
  string id = 1;
  string password = 2;
  // current_password is the account's present password. Changing your own
  // password requires it: the session alone is a cookie that script in the
  // dashboard can ride, and a password it chose would outlive the session. A
  // missing or wrong one is refused, and a wrong one counts towards the same
  // lockout as a failed sign-in. An administrator resetting another account
  // does not send it.
  string current_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
}

message User {
  string id = 1;
  string username = 2;
  string password = 3;
  string role = 4;
  bool two_factor_enabled = 5;
  string two_factor_secret = 6;
  repeated string recovery_codes = 7;
  // disabled, when true, blocks the account from logging in without deleting it.
  bool disabled = 8;
  // two_factor_pending, when true, marks 2FA as mandated by an administrator but
  // not yet enrolled by the user. The TOTP secret is generated by the user during
  // self-service enrollment, never by the admin.
  bool two_factor_pending = 9;
}

message Setup2FARequest {
  string id = 1;
  // password is the account's current password. Setup is self-service, and
  // the session alone is not enough to start it: script running in the
  // dashboard rides the session cookie without being able to read it, and
  // would otherwise enrol the account with a TOTP secret it holds. A missing
  // or wrong password is refused before a secret is generated, and counts
  // towards the same lockout as a failed sign-in.
  string password = 2;
}

message Setup2FAResponse {
  string secret = 1;
  string qr_code_url = 2;
  repeated string recovery_codes = 3;
  // challenge proves the password setup was given, and completes enrolment
  // through POST /v1/auth/2fa/verify, as LoginResponse.two_factor_challenge
  // completes a sign-in. See ADR 0039.
  string challenge = 4;
}

// Enroll2FAResponse answers POST /v1/auth/2fa/enroll, the first-time enrollment
// an account makes at login when an administrator has required 2FA. The login
// page reads it as the generated type, so its field names come from here.
message Enroll2FAResponse {
  // Id is the enrolling account's, which completes enrollment through
  // POST /v1/auth/2fa/verify.
  string id = 1;
  string secret = 2;
  string qr_code_url = 3;
  repeated string recovery_codes = 4;
}

message Verify2FARequest {
  string id = 1;
  string code = 2;
  // challenge is LoginResponse.two_factor_challenge, or
  // Setup2FAResponse.challenge, for the account id names. A missing, expired
  // or stale one, or one for another account, is refused before the code is
  // looked at, and does not count towards the account's lockout. See ADR 0039.
  string challenge = 3;
}

message Verify2FAResponse {
  bool success = 1;
  string token = 2;
  User user = 3;
}

// ApiToken is a long-lived, scoped credential an administrator issues to a
// machine -- a Prometheus scraper -- so it does not need a user's eight-hour
// session. Only its hash is stored; the secret is shown once, in
// CreateApiTokenResponse, and never again. It is accepted only where one of
// its scopes allows (today: GET /metrics with "metrics:read"), never as a
// dashboard session, and the proxy withholds it from every backend. ADR 0050.
message ApiToken {
  string id = 1;
  string name = 2;
  repeated string scopes = 3;
  // hint is the token's first characters: enough to tell two apart, never
  // enough to use.
  string hint = 4;
  string created_by = 5;
  string created_at = 6;
  // last_used_at is when the token was last accepted, to the minute, or ""
  // when it never has been.
  string last_used_at = 7;
  // expires_at is "" for a token that lasts until it is revoked.
  string expires_at = 8;
}

message ListApiTokensRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListApiTokensResponse {
  repeated ApiToken tokens = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CreateApiTokenRequest {
  string name = 1;
  // scopes are what the token may do: at least one, each a known read-only
  // scope. "metrics:read" is the only one today.
  repeated string scopes = 2;
  // ttl_days is how long the token lasts; 0 is until it is revoked.
  int32 ttl_days = 3;
}

message CreateApiTokenResponse {
  ApiToken token = 1;
  // secret is the token itself. It is returned here once and is not stored.
  string secret = 2;
}

message RevokeApiTokenRequest {
  string id = 1;
}

message RevokeApiTokenResponse {
  bool success = 1;
}
