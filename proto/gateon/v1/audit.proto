syntax = "proto3";

package gateon.v1;

option go_package = "github.com/gsoultan/gateon/proto/gateon/v1;gateonv1";

message AuditLog {
  string id = 1;
  string user_id = 2;
  string action = 3;
  string resource = 4;
  string details = 5;
  string timestamp = 6;
  string ip_address = 7;
  string signature = 8;
}

message ListAuditLogsRequest {
  int32 limit = 1;
  int32 page = 2;
  int32 page_size = 3;
  string search = 4;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListAuditArchivesRequest {}

message ListAuditArchivesResponse {
  repeated AuditArchive archives = 1;
}

message AuditArchive {
  string filename = 1;
  int64 size = 2;
  string created_at = 3;
}

message GetAuditArchiveRequest {
  string filename = 1;
}

message GetAuditArchiveResponse {
  repeated AuditLog logs = 1;
}

// VerifyAuditChainRequest asks for the audit log's HMAC chain to be checked,
// oldest first, over a window of at most limit entries. A window starts at
// `from` (RFC 3339; "" is the beginning of the log) or, to continue, after
// after_id -- the next_after_id an earlier answer gave. `to` (RFC 3339; "" is
// now) ends the range either way.
message VerifyAuditChainRequest {
  string from = 1;
  string to = 2;
  string after_id = 3;
  // limit caps the entries this call checks; 0 is the default (1000) and
  // anything over 5000 is 5000.
  int32 limit = 4;
}

// AuditChainBreak is the first entry the chain does not account for.
message AuditChainBreak {
  string id = 1;
  string timestamp = 2;
  string reason = 3;
}

message VerifyAuditChainResponse {
  // intact is true when every entry checked is signed and chained to the one
  // before it.
  bool intact = 1;
  int32 checked = 2;
  // first_break is set when intact is false.
  AuditChainBreak first_break = 3;
  // next_after_id continues the range in the next call; "" when complete or
  // broken.
  string next_after_id = 4;
  // complete is true when the range has no entries left to check.
  bool complete = 5;
  // last_timestamp is the newest entry checked, "" when none was.
  string last_timestamp = 6;
}
