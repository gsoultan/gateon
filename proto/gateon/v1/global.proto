syntax = "proto3";

package gateon.v1;

option go_package = "github.com/gsoultan/gateon/proto/gateon/v1;gateonv1";

import "gateon/v1/common.proto";

message GetGlobalConfigRequest {}

message GetGlobalConfigResponse {
  GlobalConfig config = 1;
}

message UpdateGlobalConfigRequest {
  GlobalConfig config = 1;
}

message UpdateGlobalConfigResponse {
  bool success = 1;
}

message GlobalConfig {
  TlsConfig tls = 1;
  RedisConfig redis = 2;
  OtelConfig otel = 3;
  LogConfig log = 4;
  AuthConfig auth = 5;
  TransportConfig transport = 6;
  WafConfig waf = 7;
  HaConfig ha = 8;
  AnomalyDetectionConfig anomaly_detection = 9;
  EbpfConfig ebpf = 10;
  reserved 11;
  ManagementConfig management = 12;
  GeoIPConfig geoip = 13;
  DebuggerConfig debugger = 14;
  SecurityAdvancedConfig security_advanced = 15;
  AlertingConfig alerting = 16;
  AuditConfig audit = 17;
  RBACConfig rbac = 18;
  // Resource profile preset: "minimal" | "standard" | "enterprise" (empty =>
  // "standard"). Sizes heavy subsystems (correlation engine, telemetry sketches,
  // trace store, retention, WAF tier) for the deployment's footprint without
  // removing capabilities. Overridable per-subsystem and by the GATEON_PROFILE env.
  string profile = 19;
  // 20 was titan, removed 2026-09-01. Nothing read the block, so all seven
  // toggles the dashboard rendered for it did nothing, and four named
  // subsystems that do not exist -- PhantomCore has no predictor, no
  // post-quantum identity and no governor.
  //
  // The phantom core itself is untouched and still runs: cmd/gateon constructs
  // it unconditionally and TitanStats continues to report on it. What goes is
  // the pretence that it was configurable.
  reserved 20;
  reserved "titan";
}

message AlertingConfig {
  bool enabled = 1;
  repeated AlertDispatcher dispatchers = 2;
  repeated AlertPlaybook playbooks = 3;
}

message AlertDispatcher {
  string id = 1;
  string name = 2;
  string type = 3; // "slack", "discord", "webhook", "telegram"
  string webhook_url = 4;
  string slack_channel = 5;
  string telegram_bot_token = 6;
  string telegram_chat_id = 7;
}

message AlertPlaybook {
  string id = 1;
  string name = 2;
  string event_type = 3; // "waf_threat", "high_anomaly", "impossible_travel", "auth_failure"
  double threshold = 4;
  repeated string dispatcher_ids = 5;
  string action = 6; // "notify", "block", "challenge"
}

message AuditConfig {
  bool enabled = 1;
  bool sign_entries = 2;
  string signature_key = 3;
  // Optional dedicated database for audit/logging storage. When unset, the
  // auth/management database is reused. database_url takes precedence over
  // database_config.
  string database_url = 4;             // sqlite:path, postgres://..., mysql://...
  DatabaseConfig database_config = 5;
  int32 retention_days = 6;
  bool archive_on_retention = 7;
}

message SecurityAdvancedConfig {
  DeceptionConfig deception = 1;
  TarpitConfig tarpit = 2;
  EntropyConfig entropy = 3;
  BehavioralConfig behavioral = 4;
  PowConfig pow = 5;
  IPReputationConfig ip_reputation = 6;
  TlsBindingConfig tls_binding = 7;
}

message IPReputationConfig {
  bool enabled = 1;
  repeated string feed_urls = 2;
  int32 update_interval_hours = 3;
  double block_threshold = 4;
  repeated IPReputationIntegration integrations = 5;
}

message IPReputationIntegration {
  string id = 1;
  string name = 2;
  string type = 3; // "abuseipdb", "virustotal", etc.
  string api_key = 4;
  bool enabled = 5;
  int32 confidence_threshold = 6;
}

message DeceptionConfig {
  bool enabled = 1;
  repeated string honeypot_paths = 2;
  bool inject_invisible_links = 3;
  repeated string invisible_link_paths = 4;
  repeated string honey_forms = 5;
  string canary_header = 6;
  string canary_token = 7;
  bool enable_troll_response = 8;
}

message TlsBindingConfig {
  bool enabled = 1;
  string cookie_name = 2;
}

message TarpitConfig {
  bool enabled = 1;
  int32 delay_base_ms = 2;
  int32 delay_max_ms = 3;
  double score_threshold = 4;
}

message EntropyConfig {
  bool enabled = 1;
  double threshold = 2;
}

message BehavioralConfig {
  bool enabled = 1;
  bool enable_impossible_travel = 2;
  bool enable_sequence_validation = 3;
}

message PowConfig {
  bool enabled = 1;
  int32 difficulty = 2;
  double score_threshold = 3;
  string secret = 4;
}

message DebuggerConfig {
  bool enabled = 1;
  // 2 was max_captures, "Maximum number of requests to keep in memory".
  // Removed 2026-08-30: there is no such list. The debugger attaches DebugInfo
  // to the pooled request state and it is nulled on release, so captured data
  // rides the request and never accumulates. max_body_size, which bounds what
  // is captured per request, is read and does work.
  reserved 2;
  reserved "max_captures";
  int32 max_body_size = 3; // Maximum body size to capture in bytes
}

message GeoIPConfig {
  bool enabled = 1;
  string db_path = 2;
  string maxmind_license_key = 3;
  bool auto_update = 4;
  int32 update_interval_days = 5;
  // BlockedCountries is a list of ISO country codes to block.
  repeated string blocked_countries = 6;
  // AllowedCountries is a list of ISO country codes to allow.
  repeated string allowed_countries = 8;
  // 7 was xdp_geofencing, removed 2026-08-25. It drove EbpfManager.BlockCountry,
  // which wrote to country_block_map -- a map keyed by a hashed country code that
  // no BPF program ever read. Geofencing is enforced by internal/middleware/geoip.go
  // against MaxMind and was never affected by this flag. Reinstating a kernel-level
  // path needs an LPM trie of geo ranges, which would be a new field.
  reserved 7;
  // AsnDbPath is the path to the GeoLite2-ASN.mmdb database used to resolve the
  // autonomous system (ASN) of attacking IPs. Optional; defaults to
  // geoip/GeoLite2-ASN.mmdb when present.
  string asn_db_path = 9;
  // CountryDbPath is the path to the optional GeoLite2-Country.mmdb database
  // used as an additional geolocation fallback.
  string country_db_path = 10;
}

// ManagementConfig holds the configuration for the Gateon management server.
message ManagementConfig {
  // Bind specifies the address to listen on. It can be an IP (e.g., "0.0.0.0") 
  // or a hostname (e.g., "admin.example.com").
  // If a hostname is provided, it is also used for host-based filtering.
  string bind = 1;
  // Port specifies the TCP port to listen on.
  string port = 2;
  // AllowedIps is a whitelist of client IPs or CIDRs allowed to access the management API.
  repeated string allowed_ips = 3;
  // Cors defines the CORS configuration for the management API.
  CorsConfig cors = 4;
  // AllowPublicManagement, if true, enables access to the management API and dashboard 
  // on all entrypoints, not just the dedicated management port.
  // Defaults to false for security.
  bool allow_public_management = 6;
  // AllowedHosts is a whitelist of hostnames (e.g., ["admin.example.com"]) 
  // allowed to access the management API on public entrypoints.
  repeated string allowed_hosts = 7;
  // GitOps config for configuration synchronization
  GitOpsConfig gitops = 11;

  reserved 5;
  reserved "host";
  // 8, 9 and 10 were xdp_management_whitelisting, enable_port_knocking and
  // port_knocking_sequence, removed 2026-08-26. Nothing ever read them, while
  // the identically-purposed ebpf.enable_knocking, ebpf.knocking_sequence and
  // the eBPF management whitelist do work. Two spellings of one setting in two
  // config sections is how that drift happened, and the one in the section
  // named "management" was the dead one -- an operator who enabled port
  // knocking where they would naturally look for it got no stealth and no
  // warning. Configure these under `ebpf`.
  reserved 8, 9, 10;
  reserved "xdp_management_whitelisting", "enable_port_knocking", "port_knocking_sequence";
}

message CorsConfig {
  repeated string allowed_origins = 1;
  repeated string allowed_methods = 2;
  repeated string allowed_headers = 3;
  repeated string exposed_headers = 4;
  bool allow_credentials = 5;
  int32 max_age = 6;
}

message GitOpsConfig {
  bool enabled = 1;
  string repository_url = 2;
  string branch = 3;
  string path = 4;
  int32 sync_interval_seconds = 5;
  // 6 was ssh_private_key, removed 2026-08-30. Nothing read it: gitops.go
  // imports only go-git's HTTP transport and authenticates with auth_token, so
  // a pasted deploy key did nothing and a private repo failed to clone with no
  // hint as to why. Adding SSH means a host-key verification story -- accepting
  // any host key would let anyone on the path serve this gateway its own
  // configuration -- so it comes back as a feature, not a field.
  reserved 6;
  reserved "ssh_private_key";
  string auth_token = 7;
}

message RBACConfig {
  bool enabled = 1;
  repeated RolePolicy roles = 2;
}

message RolePolicy {
  string role = 1;
  repeated Permission permissions = 2;
}

message Permission {
  string resource = 1; // "routes", "services", etc.
  string action = 2;   // "read", "write"
}

message WafConfig {
  bool enabled = 1;
  bool use_crs = 2;
  int32 paranoia_level = 3;
  string custom_directives = 4;
  // Protection categories
  bool sqli = 5;
  bool xss = 6;
  bool lfi = 7;
  bool rce = 8;
  bool php = 9;
  bool scanner = 10;
  bool protocol = 11;
  bool java = 12;
  bool nodejs = 14;
  bool wordpress = 15;
  bool ip_reputation = 16;
  bool dos_protection = 17;
  bool malware_detection = 18;
  bool ransomware_detection = 20;
  bool dlp = 21;
  int32 anomaly_threshold = 19;
  int32 request_body_limit = 22;
  int32 response_body_limit = 23;
  string audit_log_path = 24;
  bool audit_log_relevant_only = 25;
  BotManagementConfig bot_management = 13;
  repeated string allowed_admin_ips = 26;
  // AutoUpdateRules no longer updates anything. Rule downloading was retired
  // when gwaf replaced the previous engine (ADR 0004) and gwaf carries its own
  // rules, so this now means only "load custom rules from <data_dir>/waf/rules
  // if that directory exists" -- see waf_factory.go. Kept because that repurposed
  // behaviour is live; the name is historical.
  bool auto_update_rules = 27;

  // 28 and 29 were update_interval_hours and rules_url, removed 2026-08-27.
  // They configured the retired downloader: an interval for a loop that no
  // longer runs and a source URL for a fetch that no longer happens.
  // WAFUpdater.Start is a no-op and PerformUpdate returns ErrRuleUpdatesRetired.
  reserved 28, 29;
  reserved "update_interval_hours", "rules_url";
  string clamav_addr = 30; // Deprecated: use clamav.clamav_addr
  ClamavConfig clamav = 31;
  double entropy_threshold = 32;
  bool disable_entropy = 33;
  // Rule/inspection tier: "minimal" | "standard" | "enterprise" (empty =>
  // inherit the global profile). minimal = protocol+SQLi+XSS at PL1; standard =
  // full request-phase CRS; enterprise also enables response-phase (DLP) rules,
  // which buffer responses and cost the most CPU/latency/memory.
  string tier = 34;
  bool trust_cloudflare_headers = 35;
  bool enable_body_entropy = 36;
  bool enable_fingerprint_validation = 37;
  bool enable_confidence_scoring = 38;
  bool audit_only = 39;
  // Platform exception profiles: "wordpress" | "drupal" | "laravel" |
  // "issue_tracker". Each loads the scoped carve-outs that platform needs so it
  // does not block on its own ordinary traffic — a WordPress comment field
  // really does contain PHP, and a Jira issue really does quote SQL. They
  // compose, and they suppress named rules on named paths rather than turning
  // any detection off.
  repeated string app_profiles = 40;
  // Block an off-origin URL in a parameter the server itself fetches ("url",
  // "webhook", "feed"). Off by default: registering a webhook or importing an
  // avatar is the same request shape, so only a deployment that knows it never
  // fetches user-supplied URLs can call this always an attack. The navigation
  // half — "redirect_to", "next" — needs no flag and is always on.
  bool ssrf_protection = 41;
  // The hostnames this gateway answers on, used to tell a redirect or fetch
  // destination on this site from one somewhere else.
  //
  // This has to be configuration. The engine previously compared against the
  // request's Host header, which an attacker supplies as freely as the
  // destination — "Host: evil.tld" with "redirect_to=https://evil.tld/" compared
  // same-origin and passed. Left empty, gateon derives these from the Host()
  // rules in the routing table; set it when a route matches on something other
  // than a host, or when the gateway is reached by a name no route names.
  repeated string origins = 42;
  // What to do when a data-leak rule fires: "block" (the default) refuses the
  // response, "redact" replaces each finding with a marker and forwards the
  // rest, "audit" records it and forwards untouched.
  //
  // It applies to the data-leak corpus only — an injection is not made safe by
  // redacting it. Empty, and any value not listed above, mean block: a typo in
  // a security control must not quietly widen it.
  //
  // The reason this is not a bool is that a data-leak programme is rolled out
  // in stages — watch, then redact, then block once the false-positive rate is
  // known. An organisation that cannot risk a 403 on a customer-facing page
  // will not enable a control whose only setting is 403.
  string dlp_action = 43;
}

message ClamavConfig {
  enum InstallationMode {
    INSTALLATION_MODE_UNSPECIFIED = 0;
    INSTALLATION_MODE_LOCAL = 1;
    INSTALLATION_MODE_DOCKER = 2;
  }
  InstallationMode installation_mode = 1;
  bool auto_install = 2;
  string docker_image = 3;
  string full_scan_schedule = 4; // Cron expression
  bool low_resource_mode = 5;
  string clamav_addr = 6;
  string database_update_schedule = 7; // Cron expression
  string app_update_schedule = 8;      // Cron expression
}

message BotManagementConfig {
  bool enabled = 1;
  bool enable_js_challenge = 2;
  bool enable_browser_integrity = 5;
  int32 challenge_timeout_seconds = 3;
  string secret_key = 4;
}

message HaConfig {
  bool enabled = 1;
  string interface = 2;
  int32 virtual_router_id = 3;
  int32 priority = 4;
  repeated string virtual_ips = 5;
  int32 advert_int = 6;
  string auth_pass = 7;
  bool enable_gossip = 8;
  string gossip_bind_addr = 9;
  int32 gossip_bind_port = 10;
  repeated string gossip_peers = 11;
}

message AnomalyDetectionConfig {
  bool enabled = 1;
  // 2 was prometheus_url, removed 2026-08-30. Nothing read it, and nothing
  // could: anomaly detection reads a local aggregator, not an external
  // Prometheus. internal/telemetry/anomaly.go says so in as many words -- "It
  // uses a local aggregator instead of an external Prometheus server" -- so the
  // field named a data source the design deliberately does not use.
  reserved 2;
  reserved "prometheus_url";
  int32 check_interval_seconds = 3;
  double sensitivity = 4;
  double security_threat_threshold = 5;
  // 6 was anomaly_retention_days, removed 2026-08-30. There is nothing to
  // retain. Anomalies live in a single atomic.Pointer slot that is replaced
  // wholesale on each detection pass, so the previous set is simply dropped;
  // they are never written to SQL or Pebble. The security threats derived from
  // them are persisted, and those are already bounded -- by
  // log.security_threat_retention_days, which does work.
  reserved 6;
  reserved "anomaly_retention_days";
  bool enable_behavioral_fingerprinting = 7;
  bool enable_brute_force_detection = 8;
  bool enable_exploit_detection = 9;
}

message EbpfConfig {
  bool enabled = 1;
  bool xdp_rate_limit = 2;
  bool tc_filtering = 3;
  string interface = 4;
  bool xdp_ip_shunning = 5;
  bool xdp_load_balancing = 6;
  bool enable_knocking = 7;
  int32 mgmt_port = 8;
  repeated int32 knocking_sequence = 9;
  // TITAN extensions
  bool xdp_cuckoo_filter = 10;
  bool af_xdp_phantom = 11;
  bool xdp_ja4_blocklist = 12;
  // Permit attaching XDP in generic/SKB mode when the driver rejects the native
  // attach. Off by default and it should stay off: generic XDP runs in
  // netif_receive_generic_xdp() *after* the skb is allocated, so it drops no
  // earlier than an nftables rule while still charging every packet the full
  // program cost, plus a pskb_expand_head() when the skb lacks the 256-byte
  // XDP_PACKET_HEADROOM and an skb_linearize() when it is non-linear. On a
  // jumbo-MTU AWS ENA interface that is two extra allocations and two memcpys
  // per packet for no earlier drop. Prefer tc_filtering on such NICs.
  bool allow_generic_xdp = 13;
}

message AuthConfig {
  bool enabled = 1;
  string paseto_secret = 2;
  string sqlite_path = 3;      // Deprecated: use database_config or database_url
  string database_url = 4;     // Fallback: sqlite:path, postgres://..., mysql://...
  DatabaseConfig database_config = 5;

  // 6 was oidc, removed 2026-09-01. It described single sign-on for the
  // dashboard login, and none of it was ever built: nothing in Go read the
  // block, LoginPage.tsx has no SSO control, and there is no OIDC callback
  // route. An operator could not have reached it even by editing global.json.
  //
  // Per-route OIDC is a different thing entirely and works: auth_factory
  // dispatches "oidc" into internal/middleware/auth/oidc_validator.go,
  // configured from the middleware's own settings. This removal does not touch
  // it. Dashboard SSO returns as a feature with a login route and a callback
  // handler, not as six fields waiting for one.
  reserved 6;
  reserved "oidc";
}
