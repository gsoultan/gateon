syntax = "proto3";

package gateon.v1;

option go_package = "github.com/gsoultan/gateon/proto/gateon/v1;gateonv1";

message Trace {
  string id = 1;
  string operation_name = 2;
  string service_name = 3;
  double duration_ms = 4;
  string timestamp = 5;
  string status = 6;
  string path = 7;
  string source_ip = 8;
  string user_agent = 9;
  string method = 10;
  string referer = 11;
  string request_uri = 12;
  map<string, string> request_headers = 13;
  string request_body = 14;
  map<string, string> response_headers = 15;
  string response_body = 16;
  reserved 17;
  // string ja3 = 17;
  string ja4 = 18;
  string ja4h = 25;
  string recommendation = 19;
  double reputation = 20;
  double entrypoint_delay_ms = 21;
  double route_delay_ms = 22;
  double middleware_delay_ms = 23;
  double service_delay_ms = 24;
  // The gateway that recorded the trace, in QueryTraces results; a search
  // merges every node's archive when they share storage (ADR-0023).
  string node = 26;
}

message ListTracesRequest {
  int32 limit = 1;
  bool summary = 2;
}

message ListTracesResponse {
  repeated Trace traces = 1;
}

message GetTraceRequest {
  string id = 1;
  string timestamp = 2; // RFC3339
}

message GetTraceResponse {
  Trace trace = 1;
}

// QueryTracesRequest asks for the traces whose requests started in a period.
// Recent periods are read from the live trace store and older ones from the
// trace archive; the caller sees one timeline.
message QueryTracesRequest {
  string from = 1;       // RFC 3339, inclusive
  string to = 2;         // RFC 3339, exclusive
  int32 limit = 3;       // default 100, at most 500
  string cursor = 4;     // next_cursor from the previous page
  bool oldest_first = 5; // default is newest first
  string status = 6;     // "", "2xx", "3xx", "4xx", "5xx" or "errors" (4xx and 5xx)
  string method = 7;     // exact, any case
  string text = 8;       // any case, within the path, ID, source IP or service
}

message QueryTracesResponse {
  repeated Trace traces = 1; // summaries: no headers or bodies
  // Continues the query where this page stopped; empty once the period has
  // been read to the end.
  string next_cursor = 2;
  // The page stopped because it had read as much as one call may, not because
  // it filled. There may be more matches further on, or none.
  bool partial = 3;
  string scanned_to = 4; // RFC 3339: how far through the period this page read
}

// TraceArchiveSegment is one node's archived hour: a file named for the UTC
// hour it holds and the node that wrote it, e.g.
// traces-2026-09-26T14Z.gw-1.ndjson.zst for 14:00-15:00 UTC at gw-1.
message TraceArchiveSegment {
  string name = 1;
  string period_start = 2; // RFC 3339, UTC
  string period_end = 3;   // RFC 3339, UTC
  int64 size_bytes = 4;
  int64 trace_count = 5;
  string archived_at = 6;
  string node = 7;
}

message TraceArchiveStatus {
  bool enabled = 1;
  bool trace_store_active = 2;
  int32 retention_days = 3;
  int64 max_size_bytes = 4;
  int64 segment_count = 5;
  int64 total_size_bytes = 6;
  string oldest_period = 7; // start of the oldest archived hour; empty if none
  string newest_period = 8;
  string last_archived_at = 9;
  string last_error = 10; // what went wrong, for a person; details are in the log
  string last_error_at = 11;
  string node = 12;           // this gateway's name in the archive
  repeated string nodes = 13; // every node with an archived hour under the root
}

message ListTraceArchivesRequest {
  string from = 1;       // RFC 3339; empty is open
  string to = 2;         // RFC 3339; empty is open
  int32 page_size = 3;   // default 48, at most 200
  string page_token = 4; // next_page_token from the previous page
}

message ListTraceArchivesResponse {
  repeated TraceArchiveSegment segments = 1; // newest first
  string next_page_token = 2;
  TraceArchiveStatus status = 3;
}
